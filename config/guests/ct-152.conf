arch: amd64
cores: 4
description: Ambiente de desenvolvimento%3A Docker rootless por usuario%0A
features: nesting=1,keyctl=1
hostname: development
memory: 8192
nameserver: 192.168.15.1
net0: name=eth0,bridge=vmbr0,firewall=1,gw=192.168.15.1,ip=192.168.15.62/24,type=veth
onboot: 1
ostype: ubuntu
rootfs: local-lvm:vm-152-disk-0,size=60G
swap: 1024
unprivileged: 1
lxc.idmap: u 0 100000 196608
lxc.idmap: g 0 100000 196608
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
